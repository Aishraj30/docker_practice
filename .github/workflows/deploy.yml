name : Deploying the first project 

on :
    push:
        branches:
            - maiin
            workflow_dispatch:


jobs :
    deploy:
        runs-on: ubuntu-latest
        
        steps:
            - name: deploy to ec2 
            uses: appleboy/ssh-action@v1.2.0

            env:
                MONG0_URI:${{secrets.MONGO_URI}}
                PORT:${{secrets.PORT}}
            with:
                host:${{secrets.EC2_HOST}}
                username:${{secrets.EC2_USERNAME}}
                key:${{secrets.EC2_SSH_KEY}}
                port:22
                envs:MONGO_URI,PORT
                

                command_timeout: 15m
                timeout:2m

                scripts : |
                set -eu
                
                PROJECT_DIR="/home/ubuntu/docker_practice"
                cd "$PROJECT_DIR"

                echo "updating source code"

                git pull --ff-only origin main

                echo "building and starting caoontianers"

                docker compose up -d --build --remove-orphans

                echo "checking deployemnt"

                docker compose up

                echo "deplyment completed"


                