
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockFlow Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>StockFlow Cloudnexus Inventory</h1>
    <p>Simple E-commerce Inventory Management</p>

    <form id="product-form">
      <input id="name" placeholder="Product name" required>
      <input id="price" type="number" placeholder="Price (₹)" min="0" step="0.01" required>
      <input id="stock" type="number" placeholder="Stock quantity" min="0" step="1" required>
      <button type="submit">Add Product</button>
    </form>

    <p id="message"></p>
    <h2>Products</h2>
    <div id="products">Loading products...</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
